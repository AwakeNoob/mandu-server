name: 디스코드 명령어 등록

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 명령어 등록
        run: node register-commands.js
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
